[project]
name = "self-inference"
version = "0.1.0"
description = "Building an LLM inference stack from scratch, post by post."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Per-post dependencies are added in each branch as the series progresses.
# Keep main minimal.
dev = [
  "ruff>=0.6.0",
]
post-01 = [
  # PyTorch 2.3+ dropped Intel Mac (x86_64) wheels. Pin to 2.2.x for local dev.
  # Torch 2.2.x also requires numpy<2 — numpy 2.x breaks its C extensions.
  # Transformers 5.x requires torch>=2.4, so pin to 4.x on Intel Mac.
  # RunPod (Linux + CUDA) installs the CUDA wheel separately via setup_runpod.sh.
  "torch>=2.2.0,<2.3.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy<2.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers>=4.46.0,<5.0.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.4.0 ; sys_platform == 'linux'",  # resolved from pytorch-cu124 index below
  "transformers>=4.46.0 ; sys_platform == 'linux'",
  "accelerate>=0.33.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "altair>=5.4.0",
  "vl-convert-python>=1.0.0",
  "python-dotenv>=1.0.0",
  "aiohttp>=3.9.0",
]

[tool.uv.sources]
# On Linux, resolve torch from the PyTorch CUDA 12.4 index so uv installs
# a wheel compatible with the RunPod driver (CUDA 12.4 / driver 550.x).
# On macOS, torch falls back to PyPI (CPU wheel, pinned to 2.2.x above).
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true  # only used for packages that reference it in [tool.uv.sources]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
